name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      # The sandbox image lets the Docker-backed tests run instead of skipping.
      - name: Build sandbox image
        run: docker build -f Dockerfile.sandbox -t mra-sandbox:py312 .

      - name: Git identity for test fixtures
        run: |
          git config --global user.name "mra-ci"
          git config --global user.email "mra-ci@users.noreply.github.com"

      - name: Test
        run: pytest -q -rs

      - name: Slow tests (Docker-heavy hunt, benchmark payload)
        run: pytest -q -rs -m slow
