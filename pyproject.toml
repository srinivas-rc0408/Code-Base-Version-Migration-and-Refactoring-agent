[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mra"
version = "0.3.0"
description = "Codebase-Wide Version Migration & Refactoring Agent"
requires-python = "==3.12.*"
dependencies = [
    "libcst==1.9.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "networkx==3.6.1",
    "pytest==9.1.1",
    "pytest-json-report==1.5.0",
    "ruff==0.16.8",
    "GitPython==3.1.62",
    "python-dotenv==1.2.3",
    "openai==3.16.2",
    "anthropic==1.11.0",
    "reportlab==5.0.1",
    "pypdf==6.19.0",
    "coverage==7.16.2",
]

[project.optional-dependencies]
# hypothesis + mutmut: the tests/hunt property and mutation harnesses. xdist: parallel runs.
dev = [
    "mypy==2.3.1",
    "jsonschema==4.26.0",
    "pyupgrade==3.21.2",
    "hypothesis==6.170.12",
    "mutmut==3.8.0",
    "pytest-xdist==3.8.0",
]

[project.scripts]
mra = "mra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The report embeds this glyph subset; a wheel without it cannot render a PDF.
mra = ["report/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["corpus", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto --dist loadfile: one file per worker, so a file's session fixtures run once.
addopts = "-m 'not live and not slow' -n auto --dist loadfile"
markers = [
    "live: calls a real model provider",
    "slow: Docker-heavy hunt runs and the benchmark-payload checks; `pytest -m slow`, pre-merge",
]
